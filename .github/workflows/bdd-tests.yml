name: SauceDemo BDD Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bdd-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Updated to v7 to resolve Node.js 20 deprecation warning
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Updated to v7. Installs Node 20 for your project (which meets the 18.20+ requirement)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run the WebdriverIO BDD tests
      - name: Execute WebdriverIO Tests
        run: npm test

      # 5. Updated to v7 to resolve Node.js 20 deprecation warning
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
