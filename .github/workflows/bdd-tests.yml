name: SauceDemo BDD Tests

# Trigger the workflow on push to main, pull requests, or manually
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  run-bdd-tests:
    runs-on: ubuntu-latest # Runs on a fresh Ubuntu Linux environment

    steps:
      # 1. Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (v20 LTS is recommended, README specifies 18.20+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches npm dependencies to speed up future runs

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci # 'npm ci' is faster and more reliable for CI environments than 'npm install'

      # 4. Run the WebdriverIO BDD tests
      - name: Execute WebdriverIO Tests
        run: npm test

      # 5. Upload Allure test results as an artifact (so you can download and view them)
      - name: Upload Allure Results
        if: always() # Ensures results are uploaded even if the test fails
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
