name: SauceDemo BDD Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================================
  # RUN BDD TESTS
  # ==========================================================
  run-bdd-tests:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT CODE
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # SETUP NODE.JS
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # RUN WEBDRIVERIO + CUCUMBER TESTS
      # --------------------------------------------------------
      - name: Execute WebdriverIO BDD Tests
        run: npm test


      # --------------------------------------------------------
      # GENERATE ALLURE REPORT
      # --------------------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean


      # --------------------------------------------------------
      # UPLOAD ALLURE RESULTS AS ARTIFACT
      # --------------------------------------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7


      # --------------------------------------------------------
      # SETUP GITHUB PAGES
      # --------------------------------------------------------
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5


      # --------------------------------------------------------
      # UPLOAD ALLURE REPORT TO GITHUB PAGES
      # --------------------------------------------------------
      - name: Upload Allure Report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './allure-report'


  # ==========================================================
  # DEPLOY ALLURE REPORT + SEND EMAIL
  # ==========================================================
  deploy:

    if: always()

    needs:
      - run-bdd-tests

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # DEPLOY ALLURE REPORT
      # --------------------------------------------------------
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # --------------------------------------------------------
      # VERIFY EMAIL SECRETS
      # --------------------------------------------------------
      - name: Verify Email Secrets
        if: always()
        run: |
          if [ -z "${{ secrets.EMAIL_USERNAME }}" ]; then
            echo "EMAIL_USERNAME is missing"
          else
            echo "EMAIL_USERNAME is configured"
          fi

          if [ -z "${{ secrets.EMAIL_PASSWORD }}" ]; then
            echo "EMAIL_PASSWORD is missing"
          else
            echo "EMAIL_PASSWORD is configured"
          fi


      # --------------------------------------------------------
      # SEND EMAIL
      # --------------------------------------------------------
      - name: Send Allure Report Email
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:

          # Gmail SMTP configuration
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Gmail credentials from GitHub Secrets
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          # Email details
          subject: "SauceDemo BDD Test Report - ${{ needs.run-bdd-tests.result }}"

          to: karthicksubramani970@gmail.com

          from: "durgapandiyan4@gmail.com"

          # Email body
          html_body: |
            <html>

              <body>

                <h2>SauceDemo BDD Test Execution</h2>

                <p>
                  <b>Test Status:</b>
                  ${{ needs.run-bdd-tests.result }}
                </p>

                <p>
                  <b>Repository:</b>
                  ${{ github.repository }}
                </p>

                <p>
                  <b>Branch:</b>
                  ${{ github.ref_name }}
                </p>

                <p>
                  <b>Workflow:</b>
                  ${{ github.workflow }}
                </p>

                <p>
                  <b>Run Number:</b>
                  ${{ github.run_number }}
                </p>

                <p>
                  <b>Allure Report:</b>
                  <a href="${{ steps.deployment.outputs.page_url }}">
                    Open Allure Report
                  </a>
                </p>

                <p>
                  <b>GitHub Actions Run:</b>
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                    View Test Execution
                  </a>
                </p>

                <hr>

                <p>
                  This is an automated email generated by GitHub Actions.
                </p>

              </body>

            </html>
