name: SauceDemo BDD Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================================
  # RUN BDD TESTS
  # ==========================================================
  run-bdd-tests:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT REPOSITORY
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # SETUP NODE.JS
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # EXECUTE WEBDRIVERIO + CUCUMBER BDD TESTS
      # --------------------------------------------------------
      - name: Execute WebdriverIO BDD Tests
        run: npm test


      # --------------------------------------------------------
      # GENERATE ALLURE REPORT
      # --------------------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean


      # --------------------------------------------------------
      # UPLOAD ALLURE RESULTS
      # --------------------------------------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7


      # --------------------------------------------------------
      # SETUP GITHUB PAGES
      # --------------------------------------------------------
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5


      # --------------------------------------------------------
      # UPLOAD ALLURE REPORT TO GITHUB PAGES
      # --------------------------------------------------------
      - name: Upload Allure Report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './allure-report'


  # ==========================================================
  # DEPLOY ALLURE REPORT
  # ==========================================================
  deploy:

    if: always()

    needs:
      - run-bdd-tests

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # DEPLOY TO GITHUB PAGES
      # --------------------------------------------------------
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # --------------------------------------------------------
      # CAPTURE EXECUTION DATE AND TIME
      # --------------------------------------------------------
      - name: Capture Execution Timestamp
        id: timestamp
        if: always()
        run: |
          echo "datetime=$(TZ=Asia/Kolkata date '+%d-%b-%Y %I:%M:%S %p IST')" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # SEND TEST EXECUTION EMAIL
      # --------------------------------------------------------
      - name: Send Test Execution Email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:

          # Gmail SMTP
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Gmail credentials
          username: ${{ secrets.DURGA }}
          password: ${{ secrets.DURGAPASSWORD }}

          # Email information
          from: durgapandiyan4@gmail.com
          to: karthicksubramani970@gmail.com,durgapandiyan4@gmail.com

          # Subject with execution status, run number and timestamp
          subject: "[${{ needs.run-bdd-tests.result }}] SauceDemo BDD Automation | Run #${{ github.run_number }} | ${{ steps.timestamp.outputs.datetime }}"

          # ----------------------------------------------------
          # PROFESSIONAL CI/CD EMAIL CONTENT
          # ----------------------------------------------------
          html_body: |
            <!DOCTYPE html>
            <html>

            <body style="font-family: Arial, Helvetica, sans-serif;
                         font-size: 14px;
                         color: #333333;
                         line-height: 1.5;">

    

              <h3>Execution Summary</h3>

              <table
                cellpadding="8"
                cellspacing="0"
                border="1"
                style="border-collapse: collapse;
                       width: 100%;
                       max-width: 700px;">

                <tr>
                  <td><b>Test Status</b></td>
                  <td>${{ needs.run-bdd-tests.result }}</td>
                </tr>

                <tr>
                  <td><b>Repository</b></td>
                  <td>${{ github.repository }}</td>
                </tr>

                <tr>
                  <td><b>Branch</b></td>
                  <td>${{ github.ref_name }}</td>
                </tr>

                <tr>
                  <td><b>Workflow</b></td>
                  <td>${{ github.workflow }}</td>
                </tr>

                <tr>
                  <td><b>Run Number</b></td>
                  <td>#${{ github.run_number }}</td>
                </tr>

                <tr>
                  <td><b>Execution Date & Time</b></td>
                  <td>${{ steps.timestamp.outputs.datetime }}</td>
                </tr>

              </table>


              <h3>Test Report</h3>

              <p>
                The Allure report has been generated and published to
                GitHub Pages. The detailed BDD execution results,
                scenarios, steps and test outcomes can be reviewed
                using the link below.
              </p>

              <p>
                <a href="${{ steps.deployment.outputs.page_url }}">
                  <b>View Allure Test Report</b>
                </a>
              </p>


              <h3>Pipeline Execution</h3>

              <p>
                For complete CI/CD execution details, workflow logs
                and individual pipeline steps, please use the link below.
              </p>

              <p>
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  <b>View GitHub Actions Run</b>
                </a>
              </p>


              <h3>Pipeline Activities</h3>

              <ul>
                <li>Checkout source code</li>
                <li>Configure Node.js environment</li>
                <li>Install project dependencies</li>
                <li>Execute WebdriverIO and Cucumber BDD tests</li>
                <li>Generate Allure test results</li>
                <li>Publish Allure report to GitHub Pages</li>
                <li>Send automated execution notification</li>
              </ul>


              <h3>Execution Notes</h3>

              <p>
                This notification was automatically generated by the
                CI/CD pipeline after completion of the test execution.
                The linked Allure report contains the detailed test
                execution results for further analysis.
              </p>

              <hr>

             

            </body>

            </html>
