
name: SauceDemo BDD Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================================
  # RUN BDD TESTS
  # ==========================================================
  run-bdd-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute WebdriverIO Tests
        run: npm test

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure Report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './allure-report'


  # ==========================================================
  # DEPLOY ALLURE REPORT
  # ==========================================================
  deploy:
    if: always()
    needs: run-bdd-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ======================================================
      # SEND EMAIL
      # ======================================================
      - name: Send Allure Report Email
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.DURGA }}
          password: ${{ secrets.DURGAPASSWORD }}

          subject: "SauceDemo BDD Test Report - ${{ needs.run-bdd-tests.result }}"

          to: karthicksubramani970@gmail.com

          from: "BDD Automation <${{ secrets.DURGA }}>"

          html_body: |
            <html>
              <body>

                <h2>SauceDemo BDD Test Execution</h2>

                <p>
                  <b>Test Status:</b>
                  ${{ needs.run-bdd-tests.result }}
                </p>

                <p>
                  <b>Repository:</b>
                  ${{ github.repository }}
                </p>

                <p>
                  <b>Branch:</b>
                  ${{ github.ref_name }}
                </p>

                <p>
                  <b>Allure Report:</b>
                  <a href="${{ steps.deployment.outputs.page_url }}">
                    Open Allure Report
                  </a>
                </p>

                <p>
                  <b>GitHub Actions Run:</b>
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                    View Test Execution
                  </a>
                </p>

                <hr>

                <p>
                  This is an automated email generated by GitHub Actions.
                </p>

              </body>
            </html>
